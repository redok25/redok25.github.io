<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <!-- Resolve imports and game asset paths (assets/...) from the site root, like index.html. -->
    <base href="../" />
    <title>Engine checks</title>
    <link rel="icon" href="data:," />
    <meta name="robots" content="noindex" />
    <style>
      body { font: 16px monospace; background: #111; color: #ddd; padding: 16px; }
      .pass { color: #6f6; } .fail { color: #f66; }
    </style>
  </head>
  <body>
    <h1>Engine checks</h1>
    <p>Open via http://localhost/portofolio-2d/tests/check.html (ES modules need http).</p>
    <ul id="out"></ul>
    <script type="module">
      import { JOR } from "./js/helpers.js";
      import { Player } from "./js/player.js";
      import { DragRace, RedLightGreenLight } from "./js/minigames.js";
      import { mulberry32, encodeGhost, decodeGhost, parseGhostHash } from "./js/ghost.js";
      import { World } from "./js/world.js";
      import { Lighting, DARK_NIGHT, NIGHT_INK } from "./js/lighting.js";

      const out = document.getElementById("out");
      const results = [];
      const check = (name, ok, detail) => {
        results.push(ok);
        const li = document.createElement("li");
        li.className = ok ? "pass" : "fail";
        li.textContent = `${ok ? "PASS" : "FAIL"} ${name} (${detail})`;
        out.append(li);
      };

      // Feed frames of 1000/hz ms for `ms` through fixedSteps and call onStep once per sim step.
      function run(hz, ms, onStep) {
        let acc = 0, step = 0;
        // Integer frame count: summing 1000/hz in floats adds a stray frame at 60 Hz.
        for (let f = 0; f < Math.round((ms * hz) / 1000); f++) {
          const r = JOR.fixedSteps(acc, 1000 / hz);
          acc = r.acc;
          for (let i = 0; i < r.steps; i++) onStep(step++);
        }
        return step;
      }

      // (a) Distance in 3 s is the same at 30, 60 and 144 Hz.
      const distances = [30, 60, 144].map((hz) => {
        const p = new Player(200, 500);
        run(hz, 3000, () => p.update(JOR.STEP_MS, { KeyD: true }));
        return p.x - 200;
      });
      const spread = Math.max(...distances) - Math.min(...distances);
      check("3 s distance equal at 30/60/144 Hz", spread <= 10 && Math.min(...distances) > 1000, distances.map(Math.round).join(" / ") + " px");

      // (b) Drag Race: 250 ms reaction wins, 400 ms loses (reaction counted from the GO step).
      let raceSteps = null; // the steps the last race reported (P6: a win's time since GO)
      let raceGhost = null; // T4: the last win's ghost payload (as stopMinigame encodes it)
      function race(reactionMs) {
        const p = new Player(2771, 500);
        let outcome = null;
        const manager = {
          showMessage() {}, updateScore() {}, updateTimer() {},
          stopMinigame(success, message, steps = null) {
            outcome = success;
            raceSteps = steps;
            raceGhost = success ? encodeGhost(r.kind, r.seed, r.rec.data, r.rec.finish(p.x)) : null;
          },
        };
        const effects = { createDustParticles() {}, juice() {} };
        const game = { player: p, canvas: { width: 1920 }, cameraX: 0, journey: { current: 0 }, effects };
        const r = new DragRace(game, manager);
        r.start();
        let goStep = null;
        run(60, 30000, (step) => {
          if (outcome !== null) return;
          if (goStep === null && r.state === "RACING") goStep = step;
          const held = goStep !== null && (step - goStep) * JOR.STEP_MS >= reactionMs;
          p.update(JOR.STEP_MS, held ? { KeyD: true } : {});
          r.update(JOR.STEP_MS);
        });
        return outcome;
      }
      check("Drag: 250 ms reaction wins", race(250) === true, String(race(250)));
      check("Drag: 400 ms reaction loses", race(400) === false, String(race(400)));
      race(250);
      check("Drag: a 250 ms win reports 324 steps since GO (P6)", raceSteps === 324, String(raceSteps));
      {
        // T4 recorder on the real race: one sample per 6 steps since GO, each <= 60, the last one
        // over the line and none before it.
        const g = decodeGhost(raceGhost);
        const ok = !!g && g.kind === "dr" && g.n === Math.ceil(324 / 6) && g.prefix[g.n] >= 3000 && g.prefix[g.n - 1] < 3000;
        check("T4: the 250 ms Drag win records a valid ghost", ok, g ? `${raceGhost.length} chars, n ${g.n}, ${g.prefix[g.n]} px` : String(raceGhost));
      }
      race(400);
      check("Drag: a loss reports no steps (P6)", raceSteps === null, String(raceSteps));
      {
        // T330: the rival rides a bike of its own: wheels still through the countdown, then spun
        // by its speed each race step, with dust at both of its wheels and the bike's juice.
        const p = new Player(2771, 500);
        const dust = new Set();
        let juiced = 0;
        const effects = {
          createDustParticles(x) { dust.add(Math.round(x - r.rival.x)); },
          juice(bike) { if (bike === r.rival) juiced++; },
        };
        const game = { player: p, canvas: { width: 1920 }, cameraX: 0, journey: { current: 0 }, effects };
        const r = new DragRace(game, { showMessage() {}, updateScore() {}, updateTimer() {}, stopMinigame() {} });
        r.start();
        for (let i = 0; i < 400 && r.state === "COUNTDOWN"; i++) r.update(JOR.STEP_MS);
        const still = r.rival.wheelAngle === 0 && dust.size === 0 && juiced === 0 && r.rival.currentAnimation === "idle";
        for (let i = 0; i < 10; i++) r.update(JOR.STEP_MS);
        const spun = Math.abs(r.rival.wheelAngle - 10 * r.npcSpeed * p.wheelSpinMultiplier) < 1e-9;
        const wheels = [...dust].sort((a, b) => a - b).join("/");
        const ok = still && spun && juiced === 10 && r.rival.x === r.npcX && r.rival.currentAnimation === "move" && wheels === `40/${p.width - 40}`;
        check("T330: the rival's wheels wait for GO, then spin, with dust at both wheels", ok, `still ${still}, angle ${r.rival.wheelAngle.toFixed(2)}, dust at ${wheels}, juice ${juiced}`);
      }

      // (f) T4 codec (F7 c, R21, R27): a round trip and every rejection class.
      {
        const data = Uint8Array.from({ length: 600 }, (_, i) => (i * 13) % 61);
        const payload = encodeGhost("rl", 4294967295, data, 600);
        const g = decodeGhost(payload);
        let same = !!g && g.n === 600 && g.seed === 4294967295 && g.type === "red_light_green_light" && g.payload === payload;
        let sum = 0;
        for (let i = 0; same && i < 600; i++) {
          sum += data[i];
          same = g.prefix[i + 1] === sum;
        }
        const viaHash = parseGhostHash("#ghost=" + payload);
        check("T4 codec: round trip (600 samples, seed 2^32-1)", same && viaHash && viaHash.n === 600, `${payload.length} chars`);
        const A = "AAAA";
        const bad = {
          "5000 chars": "#ghost=rl.1.1." + "A".repeat(4986),
          "value 61": "#ghost=rl.1.1.AA9", "value 63": "#ghost=rl.1.1.AA_",
          "game id xx": `#ghost=xx.1.0.${A}`, "version 2": `#ghost=rl.2.1.${A}`,
          "Drag seed 5": `#ghost=dr.1.5.${A}`, "11-digit seed": `#ghost=rl.1.12345678901.${A}`,
          "seed 2^32": `#ghost=rl.1.4294967296.${A}`, "601 samples": "#ghost=rl.1.1." + "A".repeat(601),
          "bad char": "#ghost=rl.1.1.AA%41", "empty data": "#ghost=rl.1.1.",
        };
        const wrong = Object.entries(bad).filter(([, h]) => parseGhostHash(h) !== false).map(([k]) => k);
        const other = ["", "#quick/projects", "#ghost"].filter((h) => parseGhostHash(h) !== null);
        check("T4 codec: every broken link refused, other hashes ignored", !wrong.length && !other.length, wrong.concat(other).join(",") || `${Object.keys(bad).length} refused`);
      }

      // (g) T4 mulberry32: the canonical generator's first outputs (pinned from the reference).
      {
        const r = mulberry32(1), q = mulberry32(42);
        const got = [r(), r(), q(), q()].map((v) => v * 4294967296);
        const want = [2693262067, 11749833, 2581720956, 1925393290];
        check("T4 mulberry32 sequence", got.every((v, i) => v === want[i]), got.join(" "));
      }

      // (h) T4 seeded RLGL (R22): one seed gives one light sequence; another seed another one.
      {
        const lights = (seed) => {
          const game = { player: { x: 2771, velocityX: 0 }, canvas: { width: 1920 }, cameraX: 0 };
          const manager = { showMessage() {}, updateScore() {}, updateTimer() {}, stopMinigame() {}, timerElement: null };
          const r = new RedLightGreenLight(game, manager, { seed });
          r.start();
          let s = "";
          for (let i = 0; i < 3000; i++) {
            r.update(JOR.STEP_MS);
            s += r.state[0];
          }
          return s;
        };
        const a = lights(42), b = lights(42), c = lights(43);
        const switches = (a.match(/GY|YR|RG/g) || []).length;
        check("T4 RLGL lights identical for one seed", a === b && a !== c && switches >= 10, `${switches} switches in 3000 steps`);
      }

      // (c) layout(): a world laid out at one height and re-laid at another puts everything on the ground.
      {
        const canvas = document.createElement("canvas");
        canvas.width = 1440;
        canvas.height = 900;
        const w = new World(canvas, canvas.getContext("2d"));
        canvas.width = 667;
        canvas.height = 375;
        w.layout();
        const g = w.groundY();
        const npcOk = [...w.npcs, ...w.specialNPCs].every((n) => n.y === g - 87 - 12.5);
        const treeOk = w.trees.every((t) => t.y === Math.floor(g - t.height + t.jitterY) - 5);
        check("layout() re-bakes NPC and tree y", g === 375 - 80 && npcOk && treeOk, `groundY ${g}`);
      }

      // (d) P7: `braking` only on a step that pushes against the motion, cleared on every
      // step (a scripted move included); wheelX mirrors with the sprite.
      {
        const p = new Player(2771, 500);
        for (let i = 0; i < 40; i++) p.update(JOR.STEP_MS, { KeyD: true }); // "move" sprite, v 10
        const cruise = p.braking;
        p.update(JOR.STEP_MS, { KeyA: true });
        const brake = p.braking;
        const front = p.wheelX(1) - p.x; // facing left now: 200 - 166
        p.update(JOR.STEP_MS, {});
        const coast = p.braking;
        p.update(JOR.STEP_MS, { KeyA: true }); // braking again, then the offscreen "Kembali" move
        p.moveTo(p.x + 400);
        p.update(JOR.STEP_MS, {});
        const scripted = p.braking;
        const ok = !cruise && brake && front === 34 && !coast && !scripted;
        check("P7 braking flag + wheelX", ok, `${cruise}/${brake}/${front}/${coast}/${scripted}`);
      }

      // (e) V7 lighting: a night frame is a chunky darkness map (every 4 x 4 block one colour)
      // with a hole at the headlight; noon draws nothing and leaves the canvas as it was.
      {
        const canvas = document.createElement("canvas");
        canvas.width = 375;
        canvas.height = 667;
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        const ts = { r: 10, g: 10, b: 30, a: 0.5 };
        const game = {
          canvas, ctx, cameraX: 876, player: new Player(1001, 667 - 230), kopi: [], minigames: { activeMinigame: null },
          effects: { currentTimeState: ts, low: false, reducedMotion: true },
          world: { groundY: () => 667 - 80, props: [], objects: [], gauges: [] },
        };
        const L = new Lighting();
        const paint = () => { ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, 375, 667); };
        paint();
        const drew = L.render(game);
        const px = ctx.getImageData(0, 0, 375, 667).data;
        let chunky = true;
        for (let y = 0; y < 664 && chunky; y++) {
          for (let x = 0; x < 372; x++) {
            const i = (y * 375 + x) * 4, j = ((y & ~3) * 375 + (x & ~3)) * 4;
            if (px[i] !== px[j] || px[i + 1] !== px[j + 1] || px[i + 2] !== px[j + 2]) { chunky = false; break; }
          }
        }
        const at = (x, y) => px[(y * 375 + x) * 4];
        const far = at(10, 10), lens = at(1001 - 876 + 155, 437 + 124);
        const expectFar = Math.round(255 * (1 - DARK_NIGHT) + NIGHT_INK[0] * DARK_NIGHT);
        ts.a = 0;
        paint();
        const off = L.render(game);
        const untouched = ctx.getImageData(0, 0, 375, 667).data.every((v) => v === 255);
        const ok = drew && chunky && Math.abs(far - expectFar) <= 2 && lens > far + 60 && !off && L.draws === 0 && untouched;
        check("V7 lighting: chunky night map, lit headlight, noon draws nothing", ok, `${drew}/${chunky}/${far}~${expectFar}/${lens}/${off}/${L.draws}/${untouched}`);
      }

      document.title = results.every(Boolean) ? "ALL PASS" : "FAIL";
      console.log(document.title);
    </script>
  </body>
</html>
